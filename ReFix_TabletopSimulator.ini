; =============================================================================
; ReFix Universal Game Configuration File
; Tabletop Simulator (AppID 286160)
; =============================================================================

[Game]
; Human-readable name of the game
GameName=Tabletop Simulator

; Game Engine Type: Unity or Unreal
EngineType=Unity

[Debug]
; Enable in-game debug console window (toggleable in-game via Insert or F1 key) - Default: false
EnableConsole=false

; Enable in-game standalone Server Browser GUI window (toggleable in-game via F2 or Home key) - Default: false
EnableServerBrowser=true

; Enable persistent debug logfile (ReFix.log) - Default: false
EnableLog=true

[Steam]
; Emulated Steam AppId (480 = Spacewar - for P2P lobbies and overlay only)
MaskAppId=480

; Real Steam AppID of the game - used for Workshop/UGC and Server Browser
RealAppId=286160

; Game Language (english, spanish, french, german, russian, etc.)
Language=english

; Path to steam_api64.dll relative to game directory (Optional override)
SteamApiDllPath=

; Comma-separated list of DLC AppIDs unlocked for the user
DLCs=

[EOS]
; Bypass Epic Games Store login prompt via local persistent DeviceID
DeviceIdAuth=false

; Epic AppId (optional for EOS games)
EpicAppId=

[User]
; Emulated Player Profile Name
Name=Player

; Custom SteamID64 (Optional)
SteamId=

[Network]
; Lobby filter tag — host and clients MUST use the same value to discover each other
; If empty, ReFix uses "refix_game_<RealAppId>" automatically
GameFilter=

; Public IP of the host (auto-detected via api.ipify.org if empty)
PublicIP=

; Local IP override (auto-detected if left empty)
LocalIP=

[Paths]
; Additional DLLs to load on startup (comma-separated relative/absolute paths)
ExtraDLLs=
