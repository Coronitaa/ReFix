name: Release ReFix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package ReFix Deployment Suite
        shell: pwsh
        run: |
          $releaseDir = "ReFix_deploy"
          $zipName = "ReFix_Release.zip"
          if (Test-Path $releaseDir) {
              Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipName -Force
          } else {
              # If deployed from root
              $items = @("AutoDeploy.bat", "DLC_Unlocker.bat", "Uninstall_ReFix.bat", "ReFix.ini", "bin", "README.md", "README.txt")
              $validItems = $items | Where-Object { Test-Path $_ }
              Compress-Archive -Path $validItems -DestinationPath $zipName -Force
          }
          Write-Host "Package created: $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ReFix_Release.zip
          draft: false
          prerelease: false
          generate_release_notes: true
