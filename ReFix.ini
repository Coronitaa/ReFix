; =============================================================================
; ReFix Configuration — Clean Crack Research Framework
; =============================================================================
; This file controls the behavior of the ReFix DLL proxies.
; Place it next to the game executable (PenguinHotel-Win64-Shipping.exe).
;
; All settings are configurable — no hardcoded values in the DLLs.
; =============================================================================

[Steam]
; The AppId that Steam client sees (Spacewar = 480, free for all Steam users)
; This is the "mask" that lets us authenticate through Steam's network
MaskAppId=480

; The actual game AppId (MecchaChameleon = 4704690)
; Used internally by the game for content validation
RealAppId=4704690

; Game language (english, spanish, french, german, etc.)
Language=english

[EOS]
; Enable DeviceID authentication for Epic Online Services
; This creates a local device-bound identity without requiring an Epic account
DeviceIdAuth=true

; Optional: Override the Epic Account ID
; Leave empty for auto-generated ID based on device
EpicAccountId=

[User]
; Display name shown in multiplayer
; Leave empty to use the Steam account name (if Steam client is running)
Name=

; Steam64 ID override
; Leave empty to use the actual Steam account ID
; Only useful when Steam client is NOT running
SteamId=

[ReFix]
; Framework version — do not modify
Version=1.0.0

; Build type: proxy (connects to real Steam) or emulated (Goldberg offline)
; "proxy" = uses real Valve steam_api64.dll + Steam client for online play
; "emulated" = uses Goldberg emulator for offline/LAN play
Mode=proxy

; Enable debug logging to ReFix.log
Debug=false
