; =============================================================================
; ReFix Universal Steam Proxy & Network Emulation Configuration
; =============================================================================

[Game]
; Human-readable name of the target game
GameName=GenericGame

; Game Engine Type: Auto, Unity, Unreal, Godot, or Native
EngineType=Auto

[Online]
; Backend Mode:
;   valve    - Mode 1: ReFix Online via Steam (Spacewar 480 / Steam Client)
;   goldberg - Mode 2: Re:Goldberg LAN without Steam (Offline LAN emulation gbe_fork)
Mode=valve

[Steam]
; Emulated Steam AppID used for Steam connection in valve mode (Default: 480 for Spacewar)
MaskAppId=480

; Real Steam AppID of the target game. This is published in the Steam lobby so
; players using a different emulator recognise which game the lobby belongs to,
; and it is what we look for in theirs. MECCHA CHAMELEON = 4704690.
RealAppId=4704690

; Game Language (english, spanish, french, german, russian, latam, etc.)
Language=english

; Unlock all licenses, DLCs, and subscription checks for the game
BypassLicenseCheck=true

; Comma-separated list of DLC AppIDs unlocked for the user (e.g. 12345,67890)
DLCs=

[Matchmaking]
; Enable filtering for Steam lobbies (CreateLobby / RequestLobbyList).
; Keep this false. A ReFix-specific filter would hide every lobby created by a
; different emulator, and hide ours from them. Identification is done by the
; real AppID above, which is the convention emulators share.
EnableLobbyFilter=false

; Filter key injected into lobby metadata (Default: game_filter)
LobbyFilterKey=game_filter

; Filter value injected (If empty, automatically uses "refix_game_<RealAppId>")
LobbyFilterValue=

; Distance filter for RequestLobbyList: close, default, far, worldwide
LobbyDistanceFilter=worldwide

; Max results requested when searching lobbies (1-100, Default: 50)
MaxLobbyResults=50

[ServerBrowser]
; Override AppID when querying dedicated servers (RequestInternetServerList)
OverrideServerListAppId=false

; Target AppID for server browser queries (Default: 480 for Spacewar)
ServerListAppId=480

[Overlay]
; Enable Steam Overlay injection (GameOverlayRenderer64.dll - Valve mode)
EnableOverlay=true

; AppID reported to Steam Overlay injector (Default: 480)
OverlayAppId=480

[Workshop]
; AppID written to steam_appid.txt and reported by GetAppID for Workshop/UGC downloads
WorkshopAppId=1145350

; Automatically generate steam_appid.txt in game and proxy folders if missing
AutoCreateSteamAppIdFile=true

[EOS]
Backend=online-v2
DebugLogging=true
; Bypass Epic Games Store login prompt via local persistent DeviceID (Unreal Engine)
DeviceIdAuth=true

; Epic AppId (optional for EOS games)
EpicAppId=

[User]
; Emulated Player Profile Name
Name=Player

; Instance tag. Leave EMPTY for a normal install.
;
; Identity is derived from the Steam account, so two copies of the same game on
; the same PC produce the same ProductUserId and the host refuses the second one
; as a duplicate. Give one of them a tag here (or set REFIX_USER_INSTANCE in its
; environment) to make it an independent player for local two-player testing.
Instance=

; Persistent SteamID64 (e.g. 76561198000000001). Auto-generated if blank.
SteamId=

[Network]
; UDP/TCP Listen Port for Re:Goldberg LAN Discovery (Default: 47584)
ListenPort=47584

; Additional broadcast IPs for LAN / VPN discovery (e.g. 192.168.1.255, 25.255.255.255)
CustomBroadcasts=

; IPv4 multicast group used to discover lobbies. Must match on every machine.
DiscoveryGroup=239.255.71.84

; Multicast TTL. 1 = this subnet only; raise it only for routed networks.
DiscoveryTtl=1

; How long a lobby search waits for hosts to answer, in milliseconds.
SearchWaitMs=2500

; Public IP address for P2P lobby hosting (auto-detected if empty)
PublicIP=

; Local IP address override (auto-detected if empty)
LocalIP=

[Storage]
; Directory name for portable local saves (Default: saves)
LocalSave=saves

; A brand-new player has no cloud file yet and the real service answers
; NotFound, which is what ReFix answers too. Set this true only for a title
; that treats NotFound as a hard failure: it makes a missing file read back as
; an empty one. Off by default, because an empty blob is not a save and a title
; that deserialises one is worse off than a title told the file is absent.
TreatMissingFileAsEmpty=false

[Debug]
; Enable in-game debug console window (toggleable in-game via Insert or F1 key) - Default: false
EnableConsole=false

; Enable in-game standalone Server Browser GUI window (toggleable in-game via F2 or Home key) - Default: false
EnableServerBrowser=false

; Enable persistent debug logfile (ReFix.log) - Default: false
EnableLog=true

; Log file name, relative to the game folder (or an absolute path). Give a second
; local instance its own file so the two traces do not interleave.
LogFile=ReFix.log

[Paths]
; Additional DLLs to load on startup (comma-separated relative/absolute paths)
ExtraDLLs=

; =============================================================================
; Unreal Engine Re:Goldberg Configuration
; =============================================================================
[Unreal]
; Enable Re:Goldberg for Unreal Engine compatibility mode (Default: true)
EnableReGoldberg=true

; Automatically detect Unreal Engine executables, modules and OnlineSubsystems (Default: true)
AutoDetect=true

; Force Unreal Engine mode regardless of auto-detection result (Default: false)
ForceMode=false

[Unreal.Steam]
; Emulated Steam AppID for Unreal Engine OnlineSubsystem (Default: 480)
AppId=480

; Emulated Persona Name for Unreal Engine
PersonaName=ReFixPlayer

; Emulated SteamID64 (Default: 76561198000000001)
SteamId=76561198000000001

; Game Language for Unreal Engine (english, spanish, french, german, latam, etc.)
Language=english

[Unreal.Networking]
; Default Unreal Engine Game / Sockets Listen Port (Default: 7777)
ListenPort=7777

; Re:Goldberg LAN UDP Broadcast Discovery Port (Default: 47584)
DiscoveryPort=47584

; Enable LAN Discovery for Unreal Engine sessions and lobbies (Default: true)
EnableLANDiscovery=true

