; =============================================================================
; ReFix Universal Steam Proxy & Network Emulation Configuration
; =============================================================================

[Game]
; Human-readable name of the target game
GameName=Hades II

; Game Engine Type: Unity, Unreal, Godot, or Native
EngineType=Unity

[Online]
; Backend Mode:
;   valve    - Modo 1: ReFix Online por Steam (Spacewar 480 / Steam Client)
;   goldberg - Modo 2: Re:Goldberg LAN sin Steam (Emulacion offline LAN gbe_fork)
Mode=goldberg

[Steam]
; Emulated Steam AppID used for Steam connection in valve mode (Default: 480 for Spacewar)
MaskAppId=480

; Real Steam AppID of the target game (e.g. 1145350 for Hades II, 3722330 for Shift At Midnight)
RealAppId=1145350

; Game Language (english, spanish, french, german, russian, latam, etc.)
Language=english

; Unlock all licenses, DLCs, and subscription checks for the game
BypassLicenseCheck=true

; Comma-separated list of DLC AppIDs unlocked for the user (e.g. 12345,67890)
DLCs=

[Matchmaking]
; Enable filtering for Steam lobbies (CreateLobby / RequestLobbyList)
; Set to false so Spacewar (480) lobbies from all emulators (OnlineFix/Goldberg/ReFix) are listed
EnableLobbyFilter=false

; Filter key injected into lobby metadata (Default: game_filter)
LobbyFilterKey=game_filter

; Filter value injected (If empty, automatically uses "refix_game_<RealAppId>")
LobbyFilterValue=

; Distance filter for RequestLobbyList: close, default, far, worldwide
LobbyDistanceFilter=worldwide

; Max results requested when searching lobbies (1-100, Default: 50)
MaxLobbyResults=50

[ServerBrowser]
; Override AppID when querying dedicated servers (RequestInternetServerList)
OverrideServerListAppId=false

; Target AppID for server browser queries (Default: 480 for Spacewar)
ServerListAppId=480

[Overlay]
; Enable Steam Overlay injection (GameOverlayRenderer64.dll - Valve mode)
EnableOverlay=true

; AppID reported to Steam Overlay injector (Default: 480)
OverlayAppId=480

[Workshop]
; AppID written to steam_appid.txt and reported by GetAppID for Workshop/UGC downloads
WorkshopAppId=1145350

; Automatically generate steam_appid.txt in game and proxy folders if missing
AutoCreateSteamAppIdFile=true

[EOS]
; Bypass Epic Games Store login prompt via local persistent DeviceID (Unreal Engine)
DeviceIdAuth=true

; Epic AppId (optional for EOS games)
EpicAppId=

[User]
; Emulated Player Profile Name
Name=Player

; Persistent SteamID64 (e.g. 76561198000000001). Auto-generated if blank.
SteamId=

[Network]
; UDP/TCP Listen Port for Re:Goldberg LAN Discovery (Default: 47584)
ListenPort=47584

; Additional broadcast IPs for LAN / VPN discovery (e.g. 192.168.1.255, 25.255.255.255)
CustomBroadcasts=

; Public IP address for P2P lobby hosting (auto-detected if empty)
PublicIP=

; Local IP address override (auto-detected if empty)
LocalIP=

[Storage]
; Directory name for portable local saves (Default: saves)
LocalSave=saves

[Debug]
; Enable in-game debug console window (toggleable in-game via Insert or F1 key) - Default: false
EnableConsole=false

; Enable in-game standalone Server Browser GUI window (toggleable in-game via F2 or Home key) - Default: false
EnableServerBrowser=false

; Enable persistent debug logfile (ReFix.log) - Default: true
EnableLog=true

[Paths]
; Additional DLLs to load on startup (comma-separated relative/absolute paths)
ExtraDLLs=
